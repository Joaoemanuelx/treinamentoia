services:
  ollama:
    image: ollama/ollama
    container_name: ollama-outro-projeto
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./treinamento/output/merged:/models/llama32-suporte:ro
      - ./treinamento/Modelfile:/models/Modelfile:ro

  trainer:
    profiles: ["training"]
    build:
      context: ./treinamento
    environment:
      HF_TOKEN: ${HF_TOKEN}
      BASE_MODEL: meta-llama/Llama-3.2-1B-Instruct
    volumes:
      - ./treinamento:/workspace
      - huggingface-cache:/root/.cache/huggingface

volumes:
  ollama-data:
    external: true
    name: topicos-avancados_ollama-data
  huggingface-cache: